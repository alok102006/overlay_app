name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Android project
        run: python3 generate.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: videogate
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: cp videogate/app/build/outputs/apk/debug/app-debug.apk VideoGate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoGate-apk
          path: VideoGate.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: VideoGate build ${{ github.run_number }}
          files: VideoGate.apk
          make_latest: true
